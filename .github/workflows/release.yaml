name: Release CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build C Binary
        run: |
          cmake -B build
          cmake --build build

      - name: Package with nFPM
        run: |
          mkdir -p package
          nfpm package -f config/nfpm.yaml -p rpm -t package/
          nfpm package -f config/nfpm.yaml -p deb -t package/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/*.deb
            package/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

