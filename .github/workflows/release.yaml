name: Release CI/CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build C Binary
        run: |
          cmake -B build
          cmake --build build

      - name: Package with nFPM
        run: |
          mkdir -p packages
          nfpm packages --config config/nfpm.yaml --target packages/ciya-${{ github.ref_name }}-amd64.deb
          nfpm packages --config config/nfpm.yaml --target packages/ciya-${{ github.ref_name }}-amd64.rpm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

